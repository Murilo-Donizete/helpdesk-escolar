<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="topo">
        <div class="topo">
            <span class="topo-conteudo">HelpDesk Escolar</span>
            <nav class="topo-nav">
                <a href="index.html" class="ativo">Abrir Chamado</a>
                <a href="chamados.html">Ver chamados</a>
            </nav>
        </div>
    </header>
    
    <main class="conteudo">
        <div class="cartao">
            <h1>Abrir novo chamado</h1>
            <p class="subtitulo"> Descreva o problema encontrado na escola. A equipe responsavel vai analisar e atualizar os status</p>
            <form id="form-chamado" novalidate>
                <div class="campo">
                    <label for="setor">Nome do solicitante</label>
                    <input type="text" name="setor" id="setor" placeholder="EX: Sala 12, Laboratorio 2, Secretaria" required>
                </div>

                <div class="campo">
                    <label for="prioridade">prioridade</label>
                    <select name="prioridade" id="prioridade">
                        <option value="disable selected">Selecione</option>
                        <option value="Baixa">baixa</option>
                        <option value="Media">media</option>
                        <option value="Alta">alta</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="descricao">Descrição do problema</label>
                    <textarea name="descricao" id="descricao" rows="4" placeholder="Explique com detalhes oque está acontecendo" required></textarea>
                </div>
                <button type="submit" class="botao-principal">Registrar chamado</button>
                <p id="mensagem-status" class="mensagem-status" role="status" aria-live="polite"></p>
            </form>
        </div>
    </main>
    <script src="storage.js"></script>
    <script src="app.js"></script>
</body>
</html>
